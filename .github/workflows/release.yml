name: Release unscoped npm compatibility package

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      registry:
        description: Publish npm from an immutable release tag
        required: true
        type: choice
        default: validate-only
        options:
          - validate-only
          - npm

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "24", package-manager-cache: false }
      - id: version
        shell: bash
        run: |
          python3 scripts/sync-release-version.py
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "::error::Manual releases must be dispatched against an immutable tag." >&2
            exit 1
          fi
          test "$GITHUB_REF_NAME" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm test
      - name: Pack the compatibility artifact
        shell: bash
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
      - uses: actions/upload-artifact@v7
        with: { name: npm-package, path: dist/*.tgz, if-no-files-found: error }

  publish-next:
    needs: package
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.registry == 'npm'
    runs-on: ubuntu-24.04
    environment: npm
    permissions: { id-token: write }
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with: { name: npm-package, path: dist }
      - name: Publish without moving legacy latest
        run: npm publish --access public --provenance --tag next ./dist/*.tgz

  github-release:
    needs: package
    if: >-
      github.ref_type == 'tag' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.registry == 'validate-only'))
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v7
        with: { name: npm-package, path: assets }
      - run: cd assets && sha256sum *.tgz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
